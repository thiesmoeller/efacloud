ServerName localhost

DirectoryIndex index.php public/index.php

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/(attachements|authentication|classes|config|log|pdfs|tcpdf|templates|uploads)(/|$)">
    Require all denied
</DirectoryMatch>

# Block installer after setup_finish.php or the container entrypoint locks it.
<Directory /var/www/html/install>
    <IfFile "/var/www/html/install/.locked">
        Require all denied
    </IfFile>
</Directory>

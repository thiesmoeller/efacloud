ServerName localhost

DirectoryIndex index.php public/index.php

# CapRover (and local https-proxy drill) terminate TLS at the edge and forward
# HTTP here with X-Forwarded-Proto: https. Portal_session::request_is_https()
# reads that header so EFA_PORTAL cookies get the Secure flag. No Apache
# SetEnvIf required — PHP uses HTTP_X_FORWARDED_PROTO directly.

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    # Legacy audit writes malformed deny rules into persistent .htaccess files.
    # Enforce access centrally; allow overrides only for application routing.
    AllowOverride None
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/(attachements|authentication|classes|config|log|pdfs|tcpdf|templates|uploads)(/|$)">
    AllowOverride None
    Require all denied
</DirectoryMatch>

<Directory /var/www/html/api/portal/v1>
    AllowOverride FileInfo
</Directory>

<Directory /var/www/html/api/stats/v1>
    AllowOverride FileInfo
</Directory>

# Until installation is marked complete, serve only the installer.
# Bootstrap curls localhost /install/...; public app/API stay blocked.
# Complete markers: install/.locked (runtime) and/or config/.install_complete (persisted).
# Use RewriteCond (not LocationMatch inside <If>) — Apache 2.4 rejects nested Location* in <If>.
RewriteEngine On
RewriteCond %{DOCUMENT_ROOT}/install/.locked !-f
RewriteCond %{DOCUMENT_ROOT}/config/.install_complete !-f
RewriteCond %{REQUEST_URI} !^/install(?:/|$)
RewriteRule ^ - [F,L]

# Block installer after setup_finish.php or the container entrypoint locks it.
<Directory /var/www/html/install>
    <If "-f '/var/www/html/install/.locked' || -f '/var/www/html/config/.install_complete'">
        Require all denied
    </If>
</Directory>

# Dockside PWA (built assets from portal/dist). Same-origin with /api/portal/v1/.
Alias /portal /var/www/html/portal
<Directory /var/www/html/portal>
    Options -Indexes
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
    FallbackResource /portal/index.html
</Directory>

# Member-only statistics SPA. API authorization remains server-side.
Alias /stats /var/www/html/stats
<Directory /var/www/html/stats>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    FallbackResource /stats/index.html
</Directory>

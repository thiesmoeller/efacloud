# CapRover-style TLS termination for local Secure-cookie drill.
# Terminates HTTPS here, proxies plain HTTP to compose service `web:80`,
# and sets X-Forwarded-Proto: https (same headers CapRover's edge nginx sends).

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /var/log/nginx/access.log;
    client_max_body_size 32m;
    proxy_read_timeout 120s;

    # HTTPS → web with CapRover-like forwarded proto (Secure cookies expected).
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
            proxy_set_header Connection "";
        }
    }

    # Plain HTTP through the same proxy without claiming HTTPS
    # (documents lab behavior: Secure must be absent).
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Connection "";
        }
    }
}

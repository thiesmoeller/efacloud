# Build multi-stage efaCloud image and publish immutable tags to GHCR.
# CapRover staging/prod should pull the same sha-* tag (or digest) — see
# docs/deploy/image-promote.md.
name: Docker image

on:
  push:
    branches:
      - main
      - feature/caprover
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/thiesmoeller/efacloud

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long
            type=ref,event=branch

      - name: Build image (load for smoke)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke (portal assets + Apache config)
        run: |
          set -euo pipefail
          PRIMARY="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Smoke testing: $PRIMARY"
          docker run --rm --entrypoint sh "$PRIMARY" -c '
            set -e
            test -f /var/www/html/portal/index.html
            test -f /var/www/html/api/portal/v1/index.php
            test -f /var/www/html/classes/portal/Portal_session.php
            test -f /etc/apache2/conf-enabled/efacloud.conf
            . /etc/apache2/envvars
            apache2 -t
          '
          echo "Smoke OK"

      - name: Push tags to GHCR
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "Pushing $tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Resolve digest and write job summary
        run: |
          set -euo pipefail
          PRIMARY="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          # Prefer RepoDigests after push; fall back to Id
          DIGEST_REF="$(docker image inspect "$PRIMARY" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          if [[ -z "$DIGEST_REF" || "$DIGEST_REF" == "<no value>" ]]; then
            DIGEST_REF="$(docker buildx imagetools inspect "$PRIMARY" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [[ -n "$DIGEST_REF" ]]; then
              DIGEST_REF="${IMAGE}@${DIGEST_REF}"
            fi
          fi
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          FULL_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH="$(echo "$BRANCH" | tr '/' '-')"

          {
            echo "## efaCloud image published"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Registry | \`${IMAGE}\` |"
            echo "| Digest ref | \`${DIGEST_REF:-unknown}\` |"
            echo "| Tag \`sha-${SHORT_SHA}\` | \`${IMAGE}:sha-${SHORT_SHA}\` |"
            echo "| Tag \`sha-${FULL_SHA}\` | \`${IMAGE}:sha-${FULL_SHA}\` |"
            echo "| Branch tag | \`${IMAGE}:${SAFE_BRANCH}\` |"
            echo "| Commit | \`${FULL_SHA}\` |"
            echo ""
            echo "Promote staging → production with the **same** \`sha-*\` tag or digest."
            echo "See \`docs/deploy/image-promote.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Published digest: ${DIGEST_REF:-unknown}"
          echo "PRIMARY_TAG=$PRIMARY" >> "$GITHUB_ENV"
          echo "SHORT_SHA_TAG=${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Deploy image to CapRover staging
        # Repo secrets (Settings → Secrets and variables → Actions):
        #   CAPROVER_SERVER    = https://captain.project-park.de
        #   CAPROVER_APP       = efacloud-staging
        #   CAPROVER_APP_TOKEN = CapRover → Apps → efacloud-staging → Deployment → App Token
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.CAPROVER_APP }}
          token: ${{ secrets.CAPROVER_APP_TOKEN }}
          image: ${{ env.SHORT_SHA_TAG }}
